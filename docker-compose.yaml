# https://waha.devlike.pro/docs/how-to/install/
services:
  task-tracker:
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    build:
      context: .
      dockerfile: src/task-tracker/Dockerfile
    restart: unless-stopped
    environment:
      - WAHA_BASE_URL=http://waha:3000
      - HERMES_BASE_URL=http://hermes-stub:8643
      - TASK_TRACKER_BASE_URL=http://task-tracker:9005
      - TASK_CLASSIFIER_BASE_URL=http://ollama:11434/v1
      - TASK_CLASSIFIER_API_KEY=${TASK_CLASSIFIER_API_KEY:-ollama}
      - TASK_CLASSIFIER_MODEL=${TASK_CLASSIFIER_MODEL:-gemma4:e4b}
    depends_on:
      hermes-stub:
        condition: service_healthy
      ollama:
        condition: service_started
    env_file:
      - .env
    ports:
      - '9005:9005'

  hermes-stub:
    build:
      context: .
      dockerfile: src/hermes-stub/Dockerfile
    env_file:
      - .env
    environment:
      - TASK_TRACKER_BASE_URL=http://task-tracker:9005
    restart: unless-stopped
    ports:
      - '8643:8643'

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama

  waha:
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: always
    # https://waha.devlike.pro/docs/how-to/engines/#docker-images
    # https://portal.devlike.pro/docker-image
    image: devlikeapro/waha
    # WAHA Core
    # image: devlikeapro/waha:latest

    # Add "dns" if you have a problem with resolving "web.whatsapp.com"
    dns:
      - 1.1.1.1
      - 8.8.8.8

    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '10'

    ports:
      - '3000:3000'

    volumes:
      # Store sessions in the .sessions folder (comment it if you're using MongoDB)
      - '.waha/.sessions:/app/.sessions'

      # Save media files
      # https://waha.devlike.pro/docs/how-to/storages/#save-media-files-between-the-container-restarts
      - '.waha/.media:/app/.media'

    env_file:
      - .waha/.env

volumes:
  ollama_data: {}
  mongodb_data: {}
  minio_data: {}
  pg_data: {}
